      <path class="stroke main" d="M6.15 10.25h7.15c1.18 0 2.15.97 2.15 2.15v3.75c0 1.18-.97 2.15-2.15 2.15h-3.15l-2.3 1.55c-.34.23-.79-.03-.73-.44l.15-1.11H6.15c-1.18 0-2.15-.97-2.15-2.15v-3.75c0-1.18.97-2.15 2.15-2.15z"/>
      <path class="stroke detail" d="M6.55 13.2h4.15M6.55 15.45h3.25"/>
