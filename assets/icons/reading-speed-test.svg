<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="title">
  <title id="title">reading-speed-test</title>

  <rect class="reading-card-shadow" x="2.6" y="3.85" width="11.35" height="14.05" rx="1.8" fill="var(--tot-icon-reading-speed-test-shadow, #8A3842)" opacity=".32"/>
  <rect class="reading-card" x="1.85" y="3.1" width="11.35" height="14.05" rx="1.8" fill="var(--tot-icon-reading-speed-test-card, #C95A63)"/>
  <path class="reading-card-fold" d="M10.25 3.1h1.2c.96 0 1.75.79 1.75 1.75v1.2z" fill="var(--tot-icon-reading-speed-test-fold, #EFA0A6)"/>
  <path class="reading-card-lines" d="M4 7.25h6.35M4 9.85h5.65M4 12.45h6.55M4 15.05h4.9" fill="none" stroke="var(--tot-icon-reading-speed-test-lines, #F7FBFF)" stroke-width="1.2" stroke-linecap="round" opacity=".98"/>

  <rect class="stopwatch-button" x="15.6" y="8.35" width="1.8" height="1.55" rx=".45" fill="var(--tot-icon-reading-speed-test-stopwatch-case, #47586f)"/>
  <rect class="stopwatch-crown" x="16.15" y="7.55" width=".7" height="1.1" rx=".25" fill="var(--tot-icon-reading-speed-test-stopwatch-case, #47586f)"/>
  <circle class="stopwatch-body" cx="16.5" cy="15.25" r="5.05" fill="var(--tot-icon-reading-speed-test-stopwatch-face, #f7fbff)" stroke="var(--tot-icon-reading-speed-test-stopwatch-rim, #47586f)" stroke-width="1.2"/>
  <path class="stopwatch-ticks" d="M16.5 11.35v1.05M20.4 15.25H19.35M13.65 15.25H12.6M16.5 19.15V18.1" fill="none" stroke="var(--tot-icon-reading-speed-test-stopwatch-rim, #47586f)" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
  <circle class="stopwatch-center" cx="16.5" cy="15.25" r=".65" fill="var(--tot-icon-reading-speed-test-stopwatch-center, #47586f)"/>
  <path class="stopwatch-hand-main" d="M16.5 15.25l2.25-1.95" fill="none" stroke="var(--tot-icon-reading-speed-test-stopwatch-hand, #e46e4b)" stroke-width="1.35" stroke-linecap="round"/>
  <path class="stopwatch-hand-secondary" d="M16.5 15.25v-2.35" fill="none" stroke="var(--tot-icon-reading-speed-test-stopwatch-hand-secondary, #f3b646)" stroke-width="1.05" stroke-linecap="round"/>
