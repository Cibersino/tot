<!-- public/editor_find.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none';" />
  <title>toT — Buscar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tooltips.css" />
  <link rel="stylesheet" href="toasts.css" />
  <link rel="stylesheet" href="editor_find.css" />
</head>
<body data-expanded="false">
  <div id="findWrap" class="find-wrap" role="search" aria-label="Buscar en el texto">
    <div class="find-row">
      <button id="findToggle" class="btn-standard btn-standard--square" type="button" title="Mostrar reemplazo"
        aria-label="Mostrar reemplazo" data-tot-icon="expand"></button>
      <input
        id="findQuery"
        class="find-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Buscar..."
        aria-label="Buscar en el texto"
      />
      <button id="findPrev" class="btn-standard btn-standard--half-width" type="button" title="Coincidencia anterior"
        data-tot-icon="arrow-up"></button>
      <button id="findNext" class="btn-standard btn-standard--half-width" type="button" title="Coincidencia siguiente"
        data-tot-icon="arrow-down"></button>
      <span id="findStatus" class="find-status" role="status" aria-live="polite">Escribe para buscar</span>
      <button id="findClose" class="btn-standard btn-standard--square" type="button" title="Cerrar barra de busqueda"
        data-tot-icon="close"></button>
    </div>
    <div id="replaceRow" class="replace-row" hidden>
      <input
        id="findReplace"
        class="find-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Reemplazar..."
        aria-label="Texto de reemplazo"
      />
      <button id="findReplaceOne" class="btn-standard" type="button" title="Reemplazar coincidencia actual" disabled>Reemplazar</button>
      <button id="findReplaceAll" class="btn-standard" type="button" title="Reemplazar todas las coincidencias" disabled>Reemplazar todo</button>
    </div>
  </div>

  <script src="js/log.js"></script>
  <script src="js/generated_icons.js"></script>
  <script src="js/renderer_icons.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/notify.js"></script>
  <script src="editor_find.js"></script>
  <script src="js/tooltips.js"></script>
</body>
</html>
